<!DOCTYPE html>
<html>
<head>
    <title>Async If-Else Example</title>
</head>
<body>

    <h2>Check Age Example</h2>
    <button onclick="checkUserAge()">Check User Age</button>
    <p id="result"></p>

    <script>

        function getUserData() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const user = {
                        name: "vimal",
                        age: 20
                    };
                    resolve(user);
                }, 2000);
            });
        }


        async function checkUserAge() {
            const resultElement = document.getElementById("result");
            resultElement.innerText = "Loading...";

            try {
                const user = await getUserData();

                if (user.age >= 18) {
                    resultElement.innerText = user.name + " is an adult.";
                } else {
                    resultElement.innerText = user.name + " is a minor.";
                }

            } catch (error) {
                resultElement.innerText = "Error loading user data.";
            }
        }
    </script>

</body>
</html>
